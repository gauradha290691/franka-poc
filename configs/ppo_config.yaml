# Franka Pick-and-Place PPO Configuration

environment:
  name: FrankaPickPlace
  episode_length: 500

robot:
  name: Franka

conveyor:
  speed: 0.20

object:
  type: triangle

target:
  type: cube

camera:
  type: rgbd
  enabled: true

ppo:
  learning_rate: 0.0003
  gamma: 0.99
  rollout_steps: 2048
  training_iterations: 1000

training:
  num_environments: 64

checkpoint:
  path: checkpoints/franka_ppo.pth

